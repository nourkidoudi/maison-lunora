services:

  db:
    image: postgres:15
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maison_lunora

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maison_lunora"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    image: maison-lunora-backend:latest
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@db:5432/maison_lunora
      JWT_SECRET: your-secret-here

    depends_on:
      db:
        condition: service_healthy


  frontend:
    image: maison-lunora-frontend:latest
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  pgdata: